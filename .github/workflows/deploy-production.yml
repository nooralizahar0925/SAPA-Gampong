name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Branch to deploy
        required: true
        default: production
      run_seed:
        description: Run production seed script
        required: true
        type: boolean
        default: false
      build_mobile_web:
        description: Build /mobile web preview on the VPS
        required: true
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Backend And Dashboard
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy To Production VPS
    runs-on: [self-hosted, gbd-vps, deploy]
    needs: verify
    environment: production
    env:
      DEPLOY_BRANCH: ${{ github.event.inputs.deploy_branch || github.ref_name }}
      PRODUCTION_APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
      DASHBOARD_API_BASE_URL: ${{ secrets.PRODUCTION_DASHBOARD_API_BASE_URL }}
      MOBILE_WEB_API_BASE_URL: ${{ secrets.PRODUCTION_MOBILE_WEB_API_BASE_URL }}
    steps:
      - name: Deploy safely on VPS
        run: |
          APP_DIR="${PRODUCTION_APP_DIR:-/opt/gampong-blang/production/SAPA-Gampong}"
          API_BASE_URL="${DASHBOARD_API_BASE_URL:-https://gampongblangdigital.com/api}"
          MOBILE_API_BASE_URL="${MOBILE_WEB_API_BASE_URL:-$API_BASE_URL}"
          RUN_SEED="${{ github.event.inputs.run_seed }}"
          BUILD_MOBILE_WEB="${{ github.event.inputs.build_mobile_web }}"
          cd "$APP_DIR"
          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH"
          git pull --ff-only origin "$DEPLOY_BRANCH"
          SKIP_GIT_UPDATE=true RUN_SEED="$RUN_SEED" BUILD_MOBILE_WEB="$BUILD_MOBILE_WEB" DASHBOARD_API_BASE_URL="$API_BASE_URL" MOBILE_WEB_API_BASE_URL="$MOBILE_API_BASE_URL" bash scripts/deploy-production.sh

      - name: Smoke test
        run: |
          curl -fsS https://gampongblangdigital.com/api/health
          curl -fsSI https://gampongblangdigital.com/
