name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - staging
      - production

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sapa:sapa@localhost:5432/sapa_test
      JWT_SECRET: test-secret-for-ci
      APP_CONFIG_ENCRYPTION_KEY: test-encryption-key
      PUBLIC_BASE_URL: http://localhost:8081
      DASHBOARD_BASE_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8092,http://127.0.0.1:8092
      DOCS_ENABLED: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sapa
          POSTGRES_PASSWORD: sapa
          POSTGRES_DB: sapa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sapa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Create test env file
        run: |
          cat > .env.test <<EOF
          NODE_ENV=test
          PORT=8081
          DATABASE_URL=$DATABASE_URL
          JWT_SECRET=$JWT_SECRET
          APP_CONFIG_ENCRYPTION_KEY=$APP_CONFIG_ENCRYPTION_KEY
          PUBLIC_BASE_URL=$PUBLIC_BASE_URL
          DASHBOARD_BASE_URL=$DASHBOARD_BASE_URL
          CORS_ORIGINS=$CORS_ORIGINS
          DOCS_ENABLED=$DOCS_ENABLED
          EMAIL_PROVIDER_DEFAULT=mailersend
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_SECURE=false
          SMTP_FROM_EMAIL=no-reply@gampongblang.test
          SMTP_FROM_NAME=Gampong Blang Digital Test
          SEED_ADMIN_EMAIL=admin@gampongblang.test
          SEED_ADMIN_PASSWORD=admin12345
          EOF

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      VITE_API_BASE_URL: https://gampongblangdigital.com/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
