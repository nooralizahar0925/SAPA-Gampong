# Optional preview: do not build/publish it as part of an Android-only release.
# Exact index handling prevents a redirect cycle when the build is absent.
location = /mobile {
    return 308 /mobile/;
}

location = /mobile/index.html {
    alias /opt/gampong-blang/production/SAPA-Gampong/mobile/build/web/index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /mobile/assets/ {
    alias /opt/gampong-blang/production/SAPA-Gampong/mobile/build/web/assets/;
    try_files $uri =404;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /mobile/ {
    alias /opt/gampong-blang/production/SAPA-Gampong/mobile/build/web/;
    index index.html;
    try_files $uri $uri/ /mobile/index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
