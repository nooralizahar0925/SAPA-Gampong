<header class="letterhead">
  <div class="letterhead-main">
  <img
    src="{{logoDataUrl}}"
    alt="Logo Kabupaten Aceh Jaya"
    class="letterhead-logo"
  />
  <div class="letterhead-copy">
    <div class="letterhead-line">{{letterheadLine1}}</div>
    <div class="letterhead-line">{{letterheadLine2}}</div>
    <div class="letterhead-village">{{letterheadLine3}}</div>
    <div class="letterhead-address" data-value="{{letterheadAddress}}">Alamat : {{letterheadAddress}}</div>
  </div>
  </div>
  <div class="letterhead-postal" data-value="{{letterheadPostalCode}}">Kode POS. {{letterheadPostalCode}}</div>
</header>
